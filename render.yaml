# Configuracion para desplegar GRATIS en Render.com
# Sube este repositorio a GitHub y en Render elige "Blueprint"
# apuntando a este archivo.
services:
  - type: web
    name: control-parental
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # Token de seguridad. MUY recomendado: sin el, cualquiera que adivine
      # el codigo de familia controla el PC. Pon el MISMO valor en el agente
      # y en la PWA. Genera uno largo y secreto.
      - key: SHARED_TOKEN
        sync: false
